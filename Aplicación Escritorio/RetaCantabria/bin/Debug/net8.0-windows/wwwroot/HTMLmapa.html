<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Mapa Ruta</title>

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>
        console.log("HTML del mapa cargado correctamente");

        // Centro inicial (da igual, luego se ajusta a la ruta)
        const map = L.map('map').setView([40.4168, -3.7038], 13);

        // OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let rutaLayer = null;

        // Función llamada desde C#
        function dibujarRuta(puntos) {
            console.log("dibujarRuta llamada con:", puntos);

            if (!puntos || puntos.length === 0) {
                console.log("No hay puntos para dibujar");
                return;
            }

            // Limpiar ruta anterior
            if (rutaLayer) {
                map.removeLayer(rutaLayer);
            }

            // Convertir a lat/lng
            const latlngs = puntos.map(p => [p.lat, p.lng]);

            // Dibujar polilínea
            rutaLayer = L.polyline(latlngs, {
                color: 'blue',
                weight: 4
            }).addTo(map);

            // Marcador inicio
            L.marker(latlngs[0]).addTo(map);

            // Marcador fin
            L.marker(latlngs[latlngs.length - 1]).addTo(map);

            // Ajustar zoom a la ruta
            map.fitBounds(rutaLayer.getBounds());
        }
    </script>
</body>
</html>
